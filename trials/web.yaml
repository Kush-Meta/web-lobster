# Live web tasks with known answers, for `web-lobster trials`.
#
#   web-lobster trials trials/web.yaml -c configs/local-16gb.yaml -n 3
#
# Every mandate is read-only, so nothing is submitted, bought, or sent.
# python-latest's answer changes with each Python release: update `equals` when it does.

tasks:
  - id: eiffel
    task: How tall is the Eiffel Tower, in metres?
    mandate: {origins: ["https://en.wikipedia.org"], expires_in_minutes: 20}
    start_url: https://en.wikipedia.org/wiki/Eiffel_Tower
    values:
      - {name: height_m, type: number, description: "the tower's height in metres, including antennas", min: 250, max: 400}
    expect:
      height_m: {equals: 330, tolerance: 1}

  - id: python-latest
    task: Find the version number of the latest stable Python 3 release on python.org.
    mandate: {origins: ["https://www.python.org"], expires_in_minutes: 20}
    start_url: https://www.python.org/downloads/
    values:
      - {name: latest_version, type: text, description: "the latest stable Python 3 release, like 3.14.1", pattern: '3\.\d+\.\d+'}
    expect:
      latest_version: {equals: "3.14.7"}

  - id: everest
    task: Use Wikipedia's search box to find the article about Mount Everest, then find its elevation in metres.
    mandate: {origins: ["https://en.wikipedia.org"], expires_in_minutes: 20}
    start_url: https://en.wikipedia.org/wiki/Main_Page
    values:
      - {name: elevation_m, type: number, description: "Mount Everest's elevation above sea level in metres", min: 8000, max: 9000}
    expect:
      elevation_m: {equals: 8848.86, tolerance: 0.5}
