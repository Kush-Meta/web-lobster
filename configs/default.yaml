# Web Lobster — Default Configuration
# Copy this file and customize for your setup.
#
# One small text model for every role, so only one sits in memory at a time.
# This is the stack the README tells you to pull and every live test uses:
#
#   ollama pull qwen2.5-coder:7b
#
# Bigger machines: see the model options on each role below. A 70B-class
# planner wants ~48 GB, and mixing sizes makes Ollama swap models between
# calls, which costs a minute or two per task on a 16 GB machine.

# ── Planner ─────────────────────────────────────────────
# Large model for task decomposition. Called once per task.
# Prioritize reasoning quality over speed.
planner:
  backend: ollama
  model: "qwen2.5-coder:7b"   # Bigger: qwen2.5-coder:14b (~9 GB), qwen2.5:72b (~48 GB)
  base_url: "http://localhost:11434"
  temperature: 0.2
  max_tokens: 2048
  timeout: 180.0
  vision: false               # a text-only model is never sent screenshots
  context_window: 16384       # Ollama's default is too small for most web pages

# ── Executor ────────────────────────────────────────────
# Small/fast model for single-action decisions. Called every step.
# Prioritize speed and output reliability.
executor:
  backend: ollama              # Use "llamacpp" for grammar-constrained output
  model: "qwen2.5-coder:7b"   # Smaller: llama3.2:3b, phi3:mini
  base_url: "http://localhost:11434"
  temperature: 0.0             # Deterministic for reproducibility
  max_tokens: 256
  timeout: 120.0
  vision: false
  context_window: 16384
  # grammar_path: null         # Set to GGUF path if using llamacpp backend

# ── Validator ───────────────────────────────────────────
# Judges a sub-goal only when it has no evidence checks code can run.
# A vision model (minicpm-v:8b, llava:13b, qwen2-vl:7b) reads screenshots
# instead; set vision: true with one of those.
validator:
  backend: ollama
  model: "qwen2.5-coder:7b"
  base_url: "http://localhost:11434"
  temperature: 0.1
  max_tokens: 256
  timeout: 120.0
  vision: false
  context_window: 16384

# ── Browser ─────────────────────────────────────────────
browser:
  headless: false              # Set true for server/CI environments
  viewport_width: 1280
  viewport_height: 900
  default_timeout: 30.0        # Seconds to wait for elements
  screenshot_quality: 80       # JPEG quality (lower = smaller/faster)
  slow_mo: 0.0                # Milliseconds between actions (for debugging)

# ── Safety ──────────────────────────────────────────────
safety:
  dry_run: false               # Log actions without executing
  confirm_before:              # Require confirmation for elements matching these
    - submit
    - purchase
    - delete
    - send
    - pay
    - confirm
    - checkout
  url_allowlist: []            # Empty = allow all URLs
  url_blocklist:
    - "*/admin/*"
    - "*/settings/delete*"
    - "*/account/close*"
  max_actions_per_subgoal: 30
  ensemble_voting: false       # Multi-model consensus for critical actions
  ensemble_models:
    - "phi3:mini"
    - "llama3.2:3b"

# ── Agent ───────────────────────────────────────────────
agent:
  max_steps: 100               # Total steps across all sub-goals
  max_replans: 3               # Re-planning attempts before giving up
  validation_confidence_threshold: 0.7
  action_retry_limit: 2
  screenshot_mode: "dom_only"  # "hybrid", "screenshot_only", "dom_only"
  dom_mode: true               # text models read the page's elements, not pictures of them
  max_seconds: 600             # Wall-clock timeout in seconds (0 = no limit)
