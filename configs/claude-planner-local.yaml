# Web Lobster — Claude plans, local models act
#
# The planner never reads pages and makes only a few calls per task, so it's
# the cheapest place to spend on a stronger model. The executor and validator
# stay on the local 7B model. Needs ANTHROPIC_API_KEY in .env.
#
#   ollama pull qwen2.5-coder:7b

planner:
  backend: anthropic
  model: "claude-sonnet-5"
  temperature: 0.2
  max_tokens: 4096
  timeout: 120.0

executor:
  backend: ollama
  model: "qwen2.5-coder:7b"
  base_url: "http://localhost:11434"
  temperature: 0.0
  max_tokens: 256
  timeout: 120.0
  vision: false
  context_window: 16384

validator:
  backend: ollama
  model: "qwen2.5-coder:7b"
  base_url: "http://localhost:11434"
  temperature: 0.1
  max_tokens: 256
  timeout: 120.0
  vision: false
  context_window: 16384

browser:
  headless: true
  viewport_width: 1280
  viewport_height: 900
  default_timeout: 20.0
  screenshot_quality: 60

agent:
  max_steps: 40
  max_replans: 2
  validation_confidence_threshold: 0.6
  screenshot_mode: "dom_only"
  dom_mode: true
  max_seconds: 900
